server.port=8080

# Session cookie configuration for login persistence
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=PHONEBOOTH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=25d

# Firebase Admin SDK configuration
# Path to the Firebase service-account JSON key file on the classpath.
firebase.credentials.path=firebase-service-account.json
firebase.project.id=phonebooth1-f6b63

# IMPORTANT: Twilio, Razorpay, and wallet settings are stored in Firestore.
# On first boot the app seeds default placeholder values into the
# "app_config" Firestore collection via AppConfigService.initializeDefaults().
# Update the real values directly in Firestore before going live.
#
# Keys seeded automatically:
#   twilio_account_sid, twilio_auth_token, twilio_caller_id,
#   twilio_app_sid, twilio_api_key, twilio_api_secret,
#   twilio_incoming_client_identity,
#   payment_default_gateway,
#   razorpay_key_id, razorpay_key_secret, razorpay_currency,
#   razorpay_min_amount, razorpay_max_amount,
#   cashfree_app_id, cashfree_secret_key, cashfree_api_version,
#   cashfree_enabled, cashfree_sandbox, cashfree_currency,
#   wallet_registration_reward, wallet_minimum_balance,
#   outbound_call_twiml_ttl_minutes

# Dynamic outbound TwiML configuration
# Public HTTPS base URL used to build Twilio webhook URLs.
app.public-base-url=https://makecall.in
# Set true only after app.public-base-url exactly matches the HTTPS URL Twilio calls.
app.twilio.validate-signature=false

# Firebase Client SDK (Google Sign-In in the browser)
# These are PUBLIC web-app credentials from Firebase Console > Project Settings.
# They are safe to commit / embed in HTML (they are NOT the Admin service-account key).
firebase.client.api-key=AIzaSyB3PDcvgHnssJVicL-U3BkHYudKm72EtUE
firebase.client.auth-domain=phonebooth1-f6b63.firebaseapp.com
firebase.client.project-id=phonebooth1-f6b63
firebase.client.app-id=1:150801958836:web:03f574e6d4dcdcc98654e1

# Public base URL for SEO canonical links and sitemap
app.site.url=https://makecall.in

# Admin panel bootstrap allow-list (comma-separated).
# There is no admin signup flow: the FIRST time a user whose phone number or email
# appears here logs in (via /user/login, /user/google-login or /user/simple-login),
# their account is promoted to isAdmin=true in Firestore (idempotent - safe to leave
# configured permanently). After that, admin status lives only in Firestore; there is
# no "promote to admin" UI, so revoke by clearing the isBlocked/isAdmin fields directly
# in the users collection if needed.
# Example: app.admin.bootstrap-numbers=+919876543210,+919812345678
app.admin.bootstrap-numbers=admin7239962886
app.admin.bootstrap-emails=admin

