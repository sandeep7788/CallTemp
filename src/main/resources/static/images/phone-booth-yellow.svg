<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 440" role="img" aria-labelledby="boothTitle">
  <title id="boothTitle">Classic yellow landline telephone booth</title>
  <defs>
    <linearGradient id="boothBodyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE24D"/>
      <stop offset="0.55" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FB" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#CFE9F2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9DCE8" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="roofShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="boothSoftShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171717" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="428" rx="72" ry="9" fill="#000000" opacity="0.16"/>

  <g filter="url(#boothSoftShadow)">
    <!-- base plinth -->
    <rect x="52" y="398" width="136" height="24" rx="4" fill="#1c1c1c"/>
    <rect x="58" y="394" width="124" height="9" rx="3" fill="#101010"/>

    <!-- outer black cabinet frame -->
    <rect x="44" y="70" width="152" height="332" rx="14" fill="#161616"/>

    <!-- yellow body -->
    <rect x="55" y="81" width="130" height="313" rx="9" fill="url(#boothBodyShade)"/>

    <!-- side depth shading -->
    <rect x="168" y="81" width="17" height="313" rx="9" fill="#171717" opacity="0.18"/>

    <!-- roof cap -->
    <rect x="40" y="46" width="160" height="26" rx="6" fill="url(#roofShade)"/>
    <path d="M58,48 Q120,-4 182,48 Z" fill="url(#roofShade)"/>
    <circle cx="120" cy="8" r="7" fill="#111111"/>

    <!-- signage plaque -->
    <rect x="68" y="88" width="104" height="28" rx="4" fill="#fbfbfb" stroke="#171717" stroke-width="2.5"/>
    <text x="120" y="107" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="13.5" font-weight="700" letter-spacing="1.5" fill="#171717">TELEPHONE</text>

    <!-- glazed window panel -->
    <rect x="63" y="126" width="114" height="168" rx="4" fill="url(#glassShine)" stroke="#171717" stroke-width="3"/>
    <!-- glazing bars: verticals -->
    <line x1="101" y1="126" x2="101" y2="294" stroke="#171717" stroke-width="2.5"/>
    <line x1="139" y1="126" x2="139" y2="294" stroke="#171717" stroke-width="2.5"/>
    <!-- glazing bars: horizontals -->
    <line x1="63"  y1="160" x2="177" y2="160" stroke="#171717" stroke-width="2.5"/>
    <line x1="63"  y1="194" x2="177" y2="194" stroke="#171717" stroke-width="2.5"/>
    <line x1="63"  y1="228" x2="177" y2="228" stroke="#171717" stroke-width="2.5"/>
    <line x1="63"  y1="262" x2="177" y2="262" stroke="#171717" stroke-width="2.5"/>
    <!-- glass shimmer -->
    <path d="M70,132 L96,132 L78,288 L66,288 Z" fill="#ffffff" opacity="0.18"/>

    <!-- door panel -->
    <rect x="63" y="300" width="114" height="88" rx="5" fill="url(#boothBodyShade)" stroke="#171717" stroke-width="3"/>
    <rect x="70" y="308" width="100" height="72" rx="4" fill="none" stroke="#171717" stroke-width="2"/>
    <rect x="156" y="336" width="7" height="24" rx="3" fill="#171717"/>
    <circle cx="159.5" cy="348" r="1.6" fill="#fbfbfb"/>
  </g>
</svg>
